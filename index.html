<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Hạn Sử Dụng</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>📦 Quản Lý Hạn Sử Dụng</h2>
        
        <!-- Phần nhập liệu -->
        <div class="input-section">
            <input type="text" id="itemName" placeholder="Tên món hàng...">
            <input type="date" id="expiryDate">
            <button onclick="addItem()" class="add-btn">Thêm Mới</button>
        </div>

        <!-- Phần hành động -->
        <div class="action-section">
            <button onclick="exportToExcel()" class="export-btn">💾 Lưu Thành File Excel</button>
            <button onclick="document.getElementById('fileInput').click()" class="load-btn">📂 Tải File Từ Máy</button>
            <button onclick="clearAllItems()" class="refresh-btn">🗑️ Xóa Tất Cả</button> <input type="file" id="fileInput" style="display:none" accept=".xlsx, .xls" onchange="importFromExcel(event)">
        </div>

        <!-- Phần sắp xếp  -->
        <div class="sort-section">
            <label for="sortField">Sắp xếp theo:</label>
            <select id="sortField" onchange="displayItems()">
                <option value="name">Tên món hàng</option>
                <option value="date">Ngày hết hạn</option>
                <option value="diff">Số ngày còn lại</option>
            </select>

            <select id="sortOrder" onchange="displayItems()">
                <option value="asc">Tăng dần (A-Z, Gần nhất)</option>
                <option value="desc">Giảm dần (Z-A, Xa nhất)</option>
            </select>
        </div>

        <!-- Bảng danh sách món hàng -->
        <table id="itemTable">
            <thead>
                <tr>
                    <th>Tên món hàng</th>
                    <th>Ngày hết hạn</th>
                    <th>Còn lại</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="itemList">
                </tbody>
        </table>

        <!-- Phần tìm kiếm -->
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Nhập tên món hàng cần tìm...">
            <button onclick="searchItem()" class="search-btn">🔍 Tìm kiếm</button>
            <button onclick="clearSearch()" class="clear-btn">Làm mới</button>
        </div>

        <div id="searchResultBlock" class="result-block" style="display: none;">
            <h3>🎯 Kết quả tìm kiếm</h3>
            <div id="searchResultContent"></div>
        </div>


    </div>
    <script src="script.js"></script>
</body>
</html>
