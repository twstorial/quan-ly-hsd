<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Hạn Sử Dụng</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>📦 Quản Lý Hạn Sử Dụng</h2>
        
        <div class="input-section">
            <input type="text" id="itemName" placeholder="Tên món hàng...">
            <input type="date" id="expiryDate">
            <button onclick="addItem()" class="add-btn">Thêm Mới</button>
        </div>

        <div class="action-section">
            <button onclick="exportToExcel()" class="export-btn">💾 Lưu Thành File Excel</button>
            <button onclick="document.getElementById('fileInput').click()" class="load-btn">📂 Tải File Từ Máy</button>
            <input type="file" id="fileInput" style="display:none" accept=".xlsx, .xls" onchange="importFromExcel(event)">
        </div>

        <table id="itemTable">
            <thead>
                <tr>
                    <th>Tên món hàng</th>
                    <th>Ngày hết hạn</th>
                    <th>Còn lại</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="itemList">
                </tbody>
        </table>
    </div>
    <script src="script.js"></script>
</body>
</html>
